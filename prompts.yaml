prompts:
  summary:
    label: "Краткое содержание"
    model: "deepseek-chat"
    system: |
      Ты — ассистент, который делает краткое содержание текста на русском языке.
      Отвечай структурированно, без выдумок, опираясь только на предоставленный текст.
      Формат ответа строго по разделам, как указано в пользовательском сообщении.
      В тексте могут быть <unk> — нераспознанные фрагменты (обычно дефисы: всё-таки, куда-то). Исправляй очевидные ошибки Vosk.
    user: |
      Сделай краткое содержание следующего текста.

      Требования:
      1. Краткое содержание — 3-5 предложений.
      2. Основные темы — маркированный список.
      3. Полный текст — отформатированный текст, разбитый на логические
         абзацы (3-7 предложений в абзаце, пустая строка между абзацами):
         - <unk> заменить на дефис (всё-таки, куда-то);
         - исправить очевидные ошибки распознавания Vosk;
         - расставить знаки препинания и заглавные буквы;
         - сохранить смысл и структуру.

      Текст:
      {text}

  summary_short:
    label: "Краткое содержание (3 предложения)"
    model: "deepseek-chat"
    system: |
      Ты — ассистент, который делает максимально сжатое краткое содержание текста на русском языке.
      Опирайся только на предоставленный текст, без выдумок.
      В тексте могут быть <unk> — нераспознанные фрагменты (обычно дефисы: всё-таки, куда-то). Исправляй очевидные ошибки Vosk.
    user: |
      Сделай краткое содержание следующего текста ровно в 3 предложениях.
      Выведи только краткое содержание, без заголовков и списков.

      Текст:
      {text}

  structured:
    label: "Структурированный анализ"
    model: "deepseek-chat"
    system: |
      Ты — аналитик, который делает детальный структурированный разбор текста на русском языке.
      Опирайся только на предоставленный текст. Цитаты приводи дословно.
      Отвечай по разделам, как указано в пользовательском сообщении.
      В тексте могут быть <unk> — нераспознанные фрагменты (обычно дефисы: всё-таки, куда-то). Исправляй очевидные ошибки Vosk.
    user: |
      Проведи детальный анализ следующего текста.

      Требуемые разделы:
      1. Краткое содержание — 3-5 предложений.
      2. Темы — маркированный список ключевых тем.
      3. Тезисы — маркированный список основных тезисов.
      4. Ключевые цитаты — пронумерованный список дословных цитат.
      5. Полный текст — отформатированный текст, разбитый на логические
         абзацы (3-7 предложений в абзаце, пустая строка между абзацами):
         - <unk> заменить на дефис (всё-таки, куда-то);
         - исправить очевидные ошибки распознавания Vosk;
         - расставить знаки препинания и заглавные буквы;
         - сохранить смысл и структуру.

      Текст:
      {text}

  translate_en:
    label: "Перевод на английский"
    model: "deepseek-chat"
    system: |
      You are a professional translator. Translate the given text into English.
      Preserve the original formatting, paragraph breaks, lists and structure.
      Do not add commentary or explanations.
      В тексте могут быть <unk> — нераспознанные фрагменты (обычно дефисы: всё-таки, куда-то). Исправляй очевидные ошибки Vosk.
    user: |
      Translate the following text into English, preserving its formatting and structure.

      Text:
      {text}
